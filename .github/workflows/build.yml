name: Build, Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.read_output_metadata.outputs.version_code }}
      version_name: ${{ steps.read_output_metadata.outputs.version_name }}
      signing_configured: ${{ steps.signing.outputs.configured }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"

      - name: Generate keystore.properties
        id: signing
        if: ${{ github.event_name != 'pull_request' || github.ref_type == 'tag' }}
        env:
          RELEASE_KEYSTORE: ${{ vars.RELEASE_KEYSTORE }}
          RELEASE_KEY_ALIAS: ${{ vars.RELEASE_KEY_ALIAS }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASESTOREPASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASEKEYPASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$KEYSTORE_B64" ] || [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_REF" = "refs/heads/4.0-dev" ]; then
              echo "::error::The fixed Release keystore must be configured before building a release. Refusing to generate a temporary signing key."
              exit 1
            fi
            echo "Signing is not configured; this non-publishing build will produce an unsigned release APK."
            exit 0
          fi

          umask 077
          mkdir -p "$(dirname "$RELEASE_KEYSTORE")"
          echo "$KEYSTORE_B64" | base64 --decode > "$RELEASE_KEYSTORE"
          python3 .github/verify_signing.py keystore "$RELEASE_KEYSTORE"
          echo keystore.file="$RELEASE_KEYSTORE" >> keystore.properties
          echo keystore.password="$RELEASE_STORE_PASSWORD" >> keystore.properties
          echo keystore.key.alias="$RELEASE_KEY_ALIAS" >> keystore.properties
          echo keystore.key.password="$RELEASE_KEY_PASSWORD" >> keystore.properties
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: false
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/4.0-dev' }}

      - name: Test release automation
        run: python3 -m unittest discover -s .github -p 'test_*.py' -v

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Verify APK signing certificate
        if: steps.signing.outputs.configured == 'true'
        run: python3 .github/verify_signing.py apk "$ANDROID_HOME/build-tools/35.0.0/apksigner" app/build/outputs/apk/release/*.apk

      - name: Read Output Metadata
        id: read_output_metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          metadata_path = Path("./app/build/outputs/apk/release/output-metadata.json")
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          element = metadata["elements"][0]

          with open(Path(__import__("os").environ["GITHUB_OUTPUT"]), "a", encoding="utf-8") as fh:
              fh.write(f'version_code={element["versionCode"]}\n')
              fh.write(f'version_name={element["versionName"]}\n')
          PY

      - name: Upload Release Package
        uses: actions/upload-artifact@v4
        with:
          name: "release-${{ steps.read_output_metadata.outputs.version_name }}(${{ steps.read_output_metadata.outputs.version_code }})"
          path: ./app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: ./app/build/outputs/mapping/release
          if-no-files-found: error

      - name: Post to channel
        if: ${{ github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[skip post]') }}
        env:
          CHANNEL_ID: ${{ secrets.CHANNEL_DEV_ID }}
          BOT_TOKEN: ${{ secrets.BOT_DEV_TOKEN }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_MESSAGE: |+
            ```
            ${{ github.event.head_commit.message }}
            ```

            构建分支：[${{ github.ref }}](${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }})
            构建版本：[${{ github.sha }}]("$COMMIT_URL")
          ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$BOT_TOKEN" ] && [ -n "$CHANNEL_ID" ]; then
            export RELEASE=$(find ./app/build/outputs/apk/release -name "*.apk")
            ESCAPED=`python3 -c 'import json,os,urllib.parse; msg = json.dumps(os.environ["COMMIT_MESSAGE"]); print(urllib.parse.quote(msg if len(msg) <= 1024 else json.dumps(os.environ["COMMIT_URL"])))'`
            curl -v "https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup?chat_id=${CHANNEL_ID}&media=%5B%7B%22type%22%3A%22document%22%2C%22media%22%3A%22attach%3A%2F%2Frelease%22%2C%22parse_mode%22%3A%22MarkdownV2%22%2C%22caption%22%3A${ESCAPED}%7D%5D&reply_markup=%7B%22inline_keyboard%22%3A%20%5B%5B%7B%22text%22%3A%20%22%E5%9C%A8+Github+%E4%B8%8A%E6%9F%A5%E7%9C%8B%22%2C%20%22url%22%3A%20${ACTION_URL}%7D%5D%5D%7D" -F release="@$RELEASE"
          fi

      - name: Upload Mapping to App Center
        if: ${{ github.event_name != 'pull_request' || github.ref_type == 'tag' }}
        env:
          APPCENTER_ACCESS_TOKEN: ${{ secrets.APP_CENTER_TOKEN }}
          APP_CENTER_APP: ${{ secrets.APP_CENTER_APP }}
          version_code: ${{ steps.read_output_metadata.outputs.version_code }}
          version_name: ${{ steps.read_output_metadata.outputs.version_name }}
        run: |
          if [ -z "$APPCENTER_ACCESS_TOKEN" ] || [ -z "$APP_CENTER_APP" ]; then
            echo "App Center secrets are not configured, skipping mapping upload."
            exit 0
          fi

          npm install --location=global appcenter-cli
          appcenter crashes upload-mappings \
            -c "$version_code" \
            -n "$version_name" \
            -m ./app/build/outputs/mapping/release/mapping.txt \
            -a "$APP_CENTER_APP"

  release:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/4.0-dev' &&
      needs.build.outputs.signing_configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Release Package
        uses: actions/download-artifact@v4
        with:
          name: "release-${{ needs.build.outputs.version_name }}(${{ needs.build.outputs.version_code }})"
          path: dist/apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          SIGNING_CONFIGURED: ${{ needs.build.outputs.signing_configured }}
        run: bash .github/publish_release.sh dist/apk/*.apk
